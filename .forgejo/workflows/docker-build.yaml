name: Build and Push Docker Image

on:
  push:
    tags:
      - v*.*.*

env:
  REGISTRY: forgejo.kalmonipa.net
  IMAGE_NAME: kalmonipa/arty
  DOCKER_HOST: unix:///var/run/docker.sock
  DEPLOY_STACK: Arty
  API_TOKEN: some-test-token
  CHARACTER_NAME: some-character
  ROLE: some-role
  DB_HOST: some-host
  DB_PASSWORD: some-pass

jobs:
  build-and-push:
    runs-on: docker
    container:
      image: catthehacker/ubuntu:act-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Run tests
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm run test
      - name: Verify Docker connection
        run: |
          echo "Docker host: $DOCKER_HOST"
          docker version
          docker info
      - name: Log in to Container Registry
        run: |
          echo "${{ secrets.PACKAGE_TOKEN }}" | docker login ${{ env.REGISTRY }} -u "${{ secrets.REGISTRY_USERNAME }}" --password-stdin
      - name: Get Git Tag
        id: git_tag
        run: |
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "tag=$TAG" >> $GITHUB_OUTPUT
      - name: Build Docker image
        run: |
          docker build \
            --build-arg APP_VERSION=${{ steps.git_tag.outputs.tag }} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.git_tag.outputs.tag }} .
          # latest is a second name for the same image rather than a second
          # build. Two builds could differ, and only one of them would be the
          # one the version line describes
          docker tag \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.git_tag.outputs.tag }} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
      - name: Push Docker image
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.git_tag.outputs.tag }}
      - name: Get containers
        run: |
          docker ps
      - name: Deploy to server
        run: |
          set -euo pipefail

          HOST="${{ secrets.DEPLOY_HOST }}"
          USER="${{ secrets.DEPLOY_USER }}"
          PORT="${{ secrets.DEPLOY_PORT }}"
          PORT="${PORT:-22}"

          if [ -z "$HOST" ] || [ -z "$USER" ]; then
            echo "ERROR: DEPLOY_HOST and DEPLOY_USER secrets must be set"
            exit 1
          fi

          command -v ssh >/dev/null || {
            apt-get update -qq && apt-get install -y -qq openssh-client
          }

          # Without this a routing problem surfaces as a long SSH hang rather
          # than a clear failure.
          if ! timeout 5 bash -c "cat < /dev/null > /dev/tcp/$HOST/$PORT"; then
            echo "ERROR: cannot reach $HOST:$PORT from the runner"
            exit 1
          fi

          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$PORT" "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # authorized_keys forces the deploy command, so this argument is
          # ignored and the stack cannot be chosen from here.
          ssh -i ~/.ssh/deploy_key -p "$PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            "$USER@$HOST" "deploy ${{ env.DEPLOY_STACK }}"
